name: Build FG TIME Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_flavor:
        description: 'Build Flavor / Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Web Dependencies & Build Assets
        run: |
          npm ci
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          echo "Web assets successfully bundled into Android assets directory."

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Initialize Gradle Wrapper & Verify Permissions
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew
          echo "Gradle wrapper initialized."

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'fgtime2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'fgtime' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'fgtime2026' }}
        run: |
          cd android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using base64-encoded keystore from repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > fgtime-release.keystore
          else
            echo "Generating production release signing keystore for build..."
            keytool -genkey -v -keystore fgtime-release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=FG TIME, OU=Engineering, O=FG TIME, L=San Francisco, ST=California, C=US"
          fi
          
          # Verify keystore integrity
          keytool -list -keystore fgtime-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Release keystore validated successfully."

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: "fgtime-release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'fgtime2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'fgtime' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'fgtime2026' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Binary
        run: |
          echo "Inspecting generated APK files..."
          ls -lh android/app/build/outputs/apk/release/
          
          APK_FILE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK was not generated or has zero bytes!"
            exit 1
          fi

          FINAL_APK="android/app/build/outputs/apk/release/FG-TIME-v1.2.0.apk"
          cp "$APK_FILE" "$FINAL_APK"
          
          FILE_SIZE=$(ls -lh "$FINAL_APK" | awk '{print $5}')
          echo "Successfully verified signed release APK ($FILE_SIZE) at $FINAL_APK"
          echo "APK_SIZE=$FILE_SIZE" >> $GITHUB_ENV

      - name: Upload APK as Downloadable Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FG-TIME-v1.2.0-Signed-APK
          path: android/app/build/outputs/apk/release/FG-TIME-v1.2.0.apk
          if-no-files-found: error
          retention-days: 30
